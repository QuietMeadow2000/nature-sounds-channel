# URETILMIS DOSYA — elle duzenleme. Kaynak: config/channel_main.yaml
# Yeniden uretmek icin: python tools/sync_localtest.py
# Quiet Meadow — ana kanal ayarlari
# Ikinci bir kanal eklemek icin bu dosyayi kopyala (Bolum 12).

channel:
  key: localtest                      # secret onekleri ve log icin
  name: Quiet Meadow
  handle: "@quietmeadowsounds"
  language: en
  privacy_status: public
  # manual : video out/<tarih>/ altina birakilir, Studio'ya elle yuklersin.
  #          YouTube API'ye hic ihtiyac duymaz, secret gerekmez.
  # api    : videos.insert ile dogrudan yukler, thumbnail atar, playlist'e ekler.
  #
  # NOT: "denetimden gecmemis proje public yukleyemez" varsayimi YANLIS cikti.
  # 6 Eylul 2026'da olculdu: denetimsiz projeden privacyStatus: public ile
  # yuklenen video public kaldi (bkz. veo-to-youtube projesi, video INzkY1mspdc).
  # Audit basvurusu kota tavani icin faydali ama yukleme icin gerekmiyor.
  publish_mode: api
  category_id: "10"              # 10 = Music, 22 = People & Blogs (A/B test, Bolum 17)
  made_for_kids: false

audio:
  duration_min: 2   # YEREL TEST
  target_lufs: -18.0
  crossfade_sec: 5               # loop birimi ek yeri
  # Kaydin iki ucundan atilacak saniye. Ses arsivlerindeki kayitlarin
  # cogunda yukleyenin ekledigi fade-in/fade-out var ve crossfade tam
  # orayi kullaniyor; kirpmazsan ek yerinde nefes boslugu duyulur.
  edge_trim_sec: 10
  fade_in_sec: 8
  fade_out_sec: 15
  bitrate: 192k
  sample_rate: 44100
  gain_jitter: 0.10              # katman seviyeleri her gun +-%10 oynar

video:
  width: 1920
  height: 1080
  fps: 24
  # 26, 23'ten kabaca yari boyut verir. Yagmur/su goruntusu sikistirmanin
  # en zor icerigi (binlerce hareketli damla = gurultu); CRF 23'te 60 dk
  # 1,2 GB'i asiyordu. Arka planda calan ambient video icin gorsel fark
  # ihmal edilebilir, ustelik YouTube zaten yeniden kodluyor.
  crf: 26
  # Bitrate tavani (Mbps). CRF tek basina boyutu garanti etmiyor: ayni CRF'te
  # yagmur 0,96 Mbps, gunes vuran tropik su 12,9 Mbps verdi (60 dk = 5,9 GB).
  # 3 Mbps tavan en kotu durumda ~1,35 GB demek. Kolay icerik tavanin altinda
  # kalir ve etkilenmez. 0 = tavan yok.
  maxrate_mbps: 3
  # Pexels'ten kac aday indirilip aralarindan en az hareketlisi secilecek.
  # Sabit kamera hem dongude goze batmiyor hem cok daha az yer kapliyor.
  pexels_candidates: 3
  # Hizli render: dongu birimi birkac renk fazinda kodlanip parcalar
  # YENIDEN KODLANMADAN birlestiriliyor. Eskiden 3600 saniyenin tamami
  # kodlaniyordu (60 dk video = 40 dk render); simdi sadece
  # drift_variants x birim_suresi kodlaniyor.
  fast_render: true
  drift_variants: 12
  preset: veryfast
  # Saat boyunca cok yavas renk/parlaklik kaymasi. 0 = kapali (o zaman
  # tune=stillimage devreye girer ve dosya kuculur, ama 288 tekrar
  # birbirinin bit-bit kopyasi olur). 1.0 = varsayilan genlik.
  drift: 1.0
  tune: stillimage

thumbnail:
  width: 1280
  height: 720
  title_font: fonts/BebasNeue-Regular.ttf
  subtitle_font: fonts/Inter-SemiBold.ttf
  logo: logo.png
  logo_width_pct: 0.08
  darken: 0.35

drive:
  root_folder: nature-sounds-assets
  sources_sheet: sources

metadata:
  model: ""                      # bos = src/gen_metadata.py icindeki varsayilan
  max_title_chars: 70
  max_tags_chars: 500
  recent_titles_shown: 10
  locales: [es, pt, de, fr, ja]  # Bolum 16.3 otomatik ceviri

selection:
  avoid_last_n: 2                # son 2 temadan farkli olsun
  weight_floor: 0.05             # hicbir tema %5 altina inmez
  weight_ceiling: 0.35           # hicbir tema %35 ustune cikmaz

retry:
  upload_attempts: 3
  upload_backoff_min: 20

# enabled: false olan temalar secilmez. Sesi olmayan bir tema secilirse
# pipeline 'ana katman icin dosya yok' diye durur; onun yerine bastan eliyoruz.
# Yeni bir temanin sesleri Drive'a girince true yap.
themes:
  rain:
    enabled: true
    thumb_title: "RAIN SOUNDS"    # thumbnail ust satiri
    playlist_id: ""              # YouTube URL'sindeki list= sonrasi
    playlist_name: Rain Sounds
    purpose: "Sleep, Study"
    mix:
      - {role: main,  match: rain,            gain: 1.00}
      - {role: layer, match: distant_thunder, gain: 0.20}
      - {role: layer, match: light_wind,      gain: 0.10}
    pexels_queries: ["rain on window", "rain on leaves", "rainy forest"]

  ocean_waves:
    enabled: true
    thumb_title: "OCEAN WAVES"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Ocean Waves
    purpose: "Sleep, Relaxation"
    mix:
      - {role: main,  match: waves,        gain: 1.00}
      - {role: layer, match: seagull,      gain: 0.10}
      - {role: layer, match: beach_wind,   gain: 0.15}
    # Tropik tatil sahnesi: sezlong, palmiye, turkuaz su. Genel "dalga" terimleri
    # kayalik sahil ve firtinali deniz getiriyordu.
    pexels_queries: ["tropical beach lounger palm", "beach chair palm tree ocean",
                     "coconut palm beach turquoise water", "tropical beach hut palm"]

  forest_birds:
    enabled: false   # ses dosyasi yok
    thumb_title: "FOREST BIRDS"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Forest & Birds
    purpose: "Focus, Morning"
    mix:
      - {role: main,  match: birdsong,     gain: 1.00}
      - {role: layer, match: leaves_wind,  gain: 0.20}
      - {role: layer, match: distant_stream, gain: 0.12}
    pexels_queries: ["forest sunlight", "green forest canopy", "woodland morning"]

  stream:
    enabled: false   # ses dosyasi yok
    thumb_title: "RIVER SOUNDS"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Rivers & Streams
    purpose: "Meditation, Study"
    mix:
      - {role: main,  match: stream,       gain: 1.00}
      - {role: layer, match: birdsong,     gain: 0.12}
      - {role: layer, match: leaves_wind,  gain: 0.10}
    pexels_queries: ["mountain stream", "forest creek water", "river rocks"]

  thunderstorm:
    enabled: false   # ses dosyasi yok
    thumb_title: "THUNDERSTORM"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Thunderstorms
    purpose: "Deep Sleep"
    mix:
      - {role: main,  match: heavy_rain,   gain: 1.00}
      - {role: layer, match: thunder,      gain: 0.35}
      - {role: layer, match: wind_gust,    gain: 0.12}
    pexels_queries: ["thunderstorm clouds", "lightning night sky", "storm rain window"]

  wind:
    enabled: false   # ses dosyasi yok
    thumb_title: "WIND SOUNDS"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Wind Sounds
    purpose: "Relaxation"
    mix:
      - {role: main,  match: wind,         gain: 1.00}
      - {role: layer, match: grass_rustle, gain: 0.18}
      - {role: layer, match: distant_trees, gain: 0.12}
    pexels_queries: ["wind grass field", "meadow wind slow motion", "windy hillside"]

  fireplace:
    enabled: true
    thumb_title: "FIREPLACE"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Fireplace
    purpose: "Cozy, Sleep"
    mix:
      - {role: main,  match: fireplace,    gain: 1.00}
      - {role: layer, match: crackle,      gain: 0.25}
      - {role: layer, match: outside_wind, gain: 0.10}
    pexels_queries: ["fireplace closeup", "burning logs fire", "cozy fire night"]

  night_crickets:
    enabled: false   # ses dosyasi yok
    thumb_title: "NIGHT SOUNDS"    # thumbnail ust satiri
    playlist_id: ""
    playlist_name: Night Sounds
    purpose: "Sleep"
    mix:
      - {role: main,  match: crickets,     gain: 1.00}
      - {role: layer, match: night_wind,   gain: 0.15}
      - {role: layer, match: distant_owl,  gain: 0.08}
    pexels_queries: ["night sky stars", "moonlit field night", "starry night timelapse"]
