name: drawtext probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: ffmpeg -hide_banner -filters 2>&1 | grep -i drawtext || echo "DRAWTEXT YOK"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "color=c=0x2f6b45:s=1920x1080:r=24:d=10" \
            -f lavfi -i "anoisesrc=color=pink:duration=10:sample_rate=44100" -ac 2 \
            -c:v libx264 -preset veryfast -crf 28 -pix_fmt yuv420p -c:a aac -shortest \
            source.mp4
          python -c "
          import sys; sys.path.insert(0,'src')
          from pathlib import Path
          import shorts
          cfg = {'video': {'crf': 26, 'fps': 24}}
          shorts.extract_clip(Path('source.mp4'), Path('short.mp4'), cfg,
                              top_text='Rain on a Car Roof',
                              bottom_text='3 Hours Version - Tap Channel Name')
          print('BASARILI, boyut:', Path('short.mp4').stat().st_size, 'bayt')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: short-test
          path: short.mp4
