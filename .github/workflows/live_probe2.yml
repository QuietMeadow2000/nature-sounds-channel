name: Live API probe 2
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'src')
          import upload_youtube as yt
          svc = yt.client(os.environ['YT_CLIENT_ID'], os.environ['YT_CLIENT_SECRET'], os.environ['YT_REFRESH_TOKEN'])
          try:
              r = svc.liveBroadcasts().list(part='snippet,status', mine=True, maxResults=5).execute()
              print('liveBroadcasts.list OK, items:', len(r.get('items', [])))
          except Exception as e:
              print('liveBroadcasts.list HATA:', type(e).__name__, str(e)[:400])
          try:
              r2 = svc.liveStreams().list(part='snippet,cdn,status', mine=True, maxResults=5).execute()
              print('liveStreams.list OK, items:', len(r2.get('items', [])))
          except Exception as e:
              print('liveStreams.list HATA:', type(e).__name__, str(e)[:400])
          "
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
