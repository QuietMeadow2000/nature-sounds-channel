name: Kimlik kontrolu

# Yalnizca elle tetiklenir. GitHub secret'lari geri okunamadigi icin
# dogru girilip girilmedigini ancak gercek ortamda sinayarak anlariz.
# Salt okunur: hicbir video yuklemez, hicbir sey degistirmez.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - name: YouTube kimligini dogrula
        run: python tools/check_auth.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
