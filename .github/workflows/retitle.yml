name: Basliklari yenile

# Yayindaki videolarin metinlerini yeniden uretir. Varsayilan KURU calisma:
# neyin nasil degisecegini gosterir, hicbir sey degistirmez.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "YouTube'da gercekten guncelle (bos birakilirsa sadece gosterir)"
        default: false
        type: boolean
      only:
        description: "Yalnizca bu video_id (bos = hepsi)"
        required: false
        type: string

concurrency:
  group: qm-retitle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retitle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Metinleri yeniden uret
        run: |
          python tools/retitle.py \
            ${{ inputs.apply && '--apply' || '' }} \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: history.json commit
        if: inputs.apply
        run: |
          git config user.name "quiet-meadow-bot"
          git config user.email "actions@github.com"
          git add state
          git diff --staged --quiet || git commit -m "retitle: $(date -u +%F)"
          # Baska bir calisma (elle push, esanli bir is) ayni anda main'e
          # yazarsa git push 'fetch first' ile reddedilir ve kayit sessizce
          # kaybolur (27 Eylul'de tam bu oldu — gercek bir yukleme yapildi
          # ama history.json'a hic girmedi). Cakismada pull --rebase edip
          # tekrar dene.
          for i in 1 2 3; do
            git push && break
            echo "push basarisiz (deneme $i/3), pull --rebase sonrasi tekrar"
            git pull --rebase origin main
            sleep 5
          done
