name: Short zamanlamasini duzelt (tek seferlik)
on: workflow_dispatch
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-api-python-client google-auth google-auth-httplib2
      - run: |
          python -c "
          import os, sys
          sys.path.insert(0, 'src')
          import upload_youtube as yt
          svc = yt.client(os.environ['YT_CLIENT_ID'], os.environ['YT_CLIENT_SECRET'], os.environ['YT_REFRESH_TOKEN'])
          for vid in ('cUpFBncPoIk', 'KnNsUo2CYgQ'):
              r = svc.videos().update(part='status', body={
                  'id': vid,
                  'status': {'privacyStatus': 'public', 'selfDeclaredMadeForKids': False},
              }).execute()
              print(vid, '->', r['status'])
          "
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
